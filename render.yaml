# Render Blueprint — deploy with `render.yaml` at repo root.
services:
  - type: web
    name: genie
    runtime: node
    plan: free
    buildCommand: "npm install --prefix server && npm install --prefix web && npm run build --prefix web"
    startCommand: "node server/index.js"
    healthCheckPath: /api/vaults
    envVars:
      - key: GENIE_MODEL
        value: claude-haiku-4-5-20251001
      - key: ANTHROPIC_API_KEY
        sync: false # Kendall pastes this in the Render dashboard; never in code
